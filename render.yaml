databases:
  - name: job-portal-db
    plan: free
    region: oregon

services:
  - type: web
    name: job-portal-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/actuator/health
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://dpg-dbkenku1egvs73cca05g-a:5432/job_portal_db_4lmx
      - key: DB_USERNAME
        fromDatabase:
          name: job-portal-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: job-portal-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://job-portal-frontend-qmon.onrender.com

  - type: web
    name: job-portal-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://job-portal-api-8zqa.onrender.com/api
