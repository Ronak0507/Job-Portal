databases:
  - name: job-portal-db
    plan: free
    region: oregon

services:
  - type: web
    name: job-portal-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: job-portal-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: job-portal-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: job-portal-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: job-portal-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: job-portal-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://job-portal-frontend-qmon.onrender.com

  - type: web
    name: job-portal-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://job-portal-api-8zqa.onrender.com/api
